                const saved = localStorage.getItem('shoekart_cart');
                return saved ? JSON.parse(saved) : [];
            });
            const [wishlist, setWishlist] = React.useState(() => {
                const saved = localStorage.getItem('shoekart_wishlist');
                return saved ? JSON.parse(saved) : [];
            });

            // User & Authentication State

                const saved = localStorage.getItem('shoekart_user');
                return saved ? JSON.parse(saved) : null;
            });
            const [isAuthModalOpen, setIsAuthModalOpen] = React.useState(false);
            const [notification, setNotification] = React.useState(null);

            // Coupons & Checkout State
            const [appliedCoupon, setAppliedCoupon] = React.useState(null);
            const [recentOrder, setRecentOrder] = React.useState(null);

            // Save to LocalStorage effects
            React.useEffect(() => {
                localStorage.setItem('shoekart_cart', JSON.stringify(cart));
            }, [cart]);

            React.useEffect(() => {
                localStorage.setItem('shoekart_wishlist', JSON.stringify(wishlist));
            }, [wishlist]);

            React.useEffect(() => {
                localStorage.setItem('shoekart_products', JSON.stringify(products));
            }, [products]);

            // Toast Notifications logic
            const showToast = (message, type = 'info') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3200);
            };

            // Wishlist toggle
            const toggleWishlist = (product) => {
                if (wishlist.some(item => item.id === product.id)) {
                    setWishlist(wishlist.filter(item => item.id !== product.id));
                    showToast(`Removed "${product.name}" from Wishlist`, 'info');
                } else {
                    setWishlist([...wishlist, product]);
                    showToast(`Added "${product.name}" to Wishlist!`, 'success');
                }
            };

            // Add to Cart
            const addToCart = (product, size, color, qty = 1) => {
                if (!size) {
                    showToast('Please select a shoe size before adding to cart!', 'warning');
                    return false;
                }
                const existingIndex = cart.findIndex(i => i.id === product.id && i.size === size);
                if (existingIndex > -1) {
                    const newCart = [...cart];
                    newCart[existingIndex].quantity += qty;
                    setCart(newCart);
                } else {
                    setCart([...cart, { ...product, size, selectedColor: color || product.colors[0], quantity: qty }]);
                }
                showToast(`Added ${product.name} (UK ${size}) to Cart!`, 'success');
                return true;
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
                showToast('Item removed from cart.', 'info');
            };

            const updateCartQty = (index, delta) => {
                const newCart = [...cart];
                newCart[index].quantity += delta;
                if (newCart[index].quantity <= 0) {
                    newCart.splice(index, 1);
                }
                setCart(newCart);
            };

            const filteredProducts = React.useMemo(() => {
                return products.filter(p => {
                    const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||

                                          p.category.toLowerCase().includes(searchQuery.toLowerCase());

                    const matchesGender = selectedGender === 'All' || p.gender === selectedGender || p.gender === 'Unisex';
                    const matchesPrice = p.price <= priceRange;

                    return matchesSearch && matchesCategory && matchesBrand && matchesGender && matchesPrice;

                    if (sortBy === 'price-low') return a.price - b.price;
                    if (sortBy === 'price-high') return b.price - a.price;
                    if (sortBy === 'rating') return b.rating - a.rating;
                    if (sortBy === 'discount') return b.discount - a.discount;
                    if (sortBy === 'newest') return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0);
                    return 0; // relevance
                });

                window.scrollTo({ top: 0, behavior: 'smooth' });

                                        </div>

            const originalSubtotal = cart.reduce((acc, item) => acc + (item.originalPrice * item.quantity), 0);
            const totalDiscount = originalSubtotal - subtotal;

            if (appliedCoupon === 'SHOEKART15') couponDiscount = subtotal * 0.15;
            if (appliedCoupon === 'FIRSTPAIR') couponDiscount = 500;

                                <div className="space-y-2 text-xs">
                                    {[
                                        { id: 'upi', name: 'UPI (Google Pay, PhonePe, Paytm)', desc: 'Instant 0% transaction fee' },
                                        { id: 'cod', name: 'Cash On Delivery (COD)', desc: 'Pay cash when shoes arrive' },
                                        { id: 'card', name: 'Credit / Debit Card', desc: 'Visa, Mastercard, RuPay' },
                                        { id: 'netbanking', name: 'NetBanking', desc: 'All Indian Banks' }
                                    ].map(pm => (
                                        <label key={pm.id} className={`flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition ${paymentMethod === pm.id ? 'border-brand-600 bg-brand-50/50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                            <input type="radio" name="payment" checked={paymentMethod === pm.id} onChange={() => setPaymentMethod(pm.id)} className="mt-0.5 text-brand-600" />
                                            <div>
                                                <div className="font-bold text-slate-800">{pm.name}</div>
                                                <div className="text-[11px] text-slate-500">{pm.desc}</div>
                                            </div>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Summary & Confirm */}
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit space-y-4">
                            <h3 className="text-sm font-bold uppercase text-slate-400">Order Summary</h3>
                            <div className="text-xs space-y-2 pb-3 border-b">
                                <div className="flex justify-between">
                                    <span>Subtotal</span>
                                    <span>₹{subtotal.toLocaleString('en-IN')}</span>
                                </div>
                                <div className="flex justify-between text-emerald-600">
                                    <span>Coupons</span>
                                    <span>-₹{couponDiscount.toLocaleString('en-IN')}</span>
                                </div>
                                <div className="flex justify-between font-bold text-slate-900 text-sm pt-2">
                                    <span>Payable Total</span>
                                    <span>₹{Math.round(finalTotal).toLocaleString('en-IN')}</span>
                                </div>
                            </div>

                            <button onClick={handlePlaceOrder} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl shadow transition text-center">
                                Complete Order & Pay
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function TrackingPage({ order, setView }) {
            React.useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            if (!order) {
                return (
                    <div className="max-w-xl mx-auto px-4 py-16 text-center">
                        <div className="bg-white p-8 rounded-xl border border-slate-200 shadow-sm space-y-3">
                            <i data-lucide="truck" className="w-12 h-12 text-slate-300 mx-auto"></i>
                            <h2 className="text-lg font-bold text-slate-800">No recent orders found</h2>
                            <p className="text-xs text-slate-500">You haven't placed an order in this session yet.</p>
                            <button onClick={() => setView('shop')} className="bg-brand-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Shop Shoes</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto px-4 py-8 space-y-6">
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
                        <div className="flex justify-between items-start border-b pb-4">
                            <div>
                                <span className="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded uppercase">Order Confirmed</span>
                                <h2 className="text-xl font-black text-slate-900 mt-1">Order #{order.id}</h2>
                                <p className="text-xs text-slate-500">Placed on {order.date}</p>
                            </div>
                            <span className="text-base font-extrabold text-slate-900">₹{order.total.toLocaleString('en-IN')}</span>
                        </div>

                        {/* Progress Stepper */}
                        <div className="grid grid-cols-4 text-center text-xs relative">
                            {['Order Placed', 'Packed', 'Shipped', 'Delivered'].map((st, i) => (
                                <div key={st} className="flex flex-col items-center">
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs mb-1 ${i <= 1 ? 'bg-brand-600 text-white' : 'bg-slate-200 text-slate-500'}`}>
                                        {i + 1}
                                    </div>
                                    <span className="font-semibold text-slate-700">{st}</span>
                                </div>
                            ))}
                        </div>

                        {/* Ordered Items */}
                        <div>
                            <h3 className="text-xs font-bold text-slate-400 uppercase mb-3">Order Items</h3>
                            <div className="space-y-2">
                                {order.items.map((item, i) => (
                                    <div key={i} className="flex items-center gap-3 p-2 bg-slate-50 rounded-lg text-xs">
                                        <img src={item.images[0]} className="w-12 h-12 object-cover rounded" />
                                        <div className="flex-1">
                                            <div className="font-bold text-slate-800">{item.name}</div>
                                            <div className="text-slate-500">Size: UK {item.size} | Qty: {item.quantity}</div>
                                        </div>
                                        <div className="font-bold text-slate-900">₹{(item.price * item.quantity).toLocaleString('en-IN')}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AccountPage({ user, setUser, setView, recentOrder }) {
            React.useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            if (!user) {
                return (
                    <div className="max-w-md mx-auto px-4 py-16 text-center">
                        <div className="bg-white p-8 rounded-xl border border-slate-200 shadow-sm space-y-3">
                            <i data-lucide="user-x" className="w-12 h-12 text-slate-300 mx-auto"></i>
                            <h2 className="text-lg font-bold text-slate-800">You are not logged in</h2>
                            <button onClick={() => setView('home')} className="bg-brand-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Return to Home</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 rounded-full bg-brand-600 text-white font-extrabold text-2xl flex items-center justify-center">
                                {user.name.charAt(0)}
                            </div>
                            <div>
                                <h2 className="text-xl font-black text-slate-900">{user.name}</h2>
                                <p className="text-xs text-slate-500">{user.email}</p>
                            </div>
                        </div>
                        <button 
                            onClick={() => {
                                setUser(null);
                                localStorage.removeItem('shoekart_user');
                                setView('home');
                            }}
                            className="bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 text-xs font-bold px-4 py-2 rounded-lg transition"
                        >
                            Logout
                        </button>
                    </div>

                    {/* Saved Addresses / Order Info */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 className="text-sm font-bold text-slate-800 mb-2">Saved Default Delivery Address</h3>
                            <p className="text-xs text-slate-600 leading-relaxed">
                                {user.name}<br />
                                102, Skyline Towers, Park Road<br />
                                Jamnagar, Gujarat - 361001<br />
                                Phone: +91 98765 43210
                            </p>
                        </div>

                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h3 className="text-sm font-bold text-slate-800 mb-2">Recent Session Orders</h3>
                            {recentOrder ? (
                                <div className="text-xs space-y-1">
                                    <div className="font-bold text-brand-600">Order #{recentOrder.id}</div>
                                    <div className="text-slate-500">Status: {recentOrder.status}</div>
                                    <button onClick={() => setView('tracking')} className="text-xs text-slate-800 font-bold hover:underline">Track Delivery →</button>
                                </div>
                            ) : (
                                <p className="text-xs text-slate-400">No order placed in current session.</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function QuickViewModal({ product, onClose, addToCart, onFullView }) {
            const [selectedSize, setSelectedSize] = React.useState(null);

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full p-6 relative shadow-2xl max-h-[90vh] overflow-y-auto">
                        <button onClick={onClose} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-800">
                            <i data-lucide="x" className="w-5 h-5"></i>
                        </button>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <img src={product.images[0]} alt={product.name} className="w-full h-64 object-cover rounded-xl bg-slate-50" />
                            <div className="space-y-4">
                                <div>
                                    <span className="text-[10px] font-black uppercase text-slate-400">{product.brand}</span>
                                    <h3 className="text-lg font-bold text-slate-900">{product.name}</h3>
                                    <div className="flex items-center gap-2 mt-1">
                                        <span className="text-xs font-bold text-emerald-600">{product.rating} ★</span>
                                        <span className="text-xs text-slate-400">({product.reviewCount} reviews)</span>
                                    </div>
                                </div>

                                <div className="flex items-baseline gap-2">
                                    <span className="text-2xl font-black text-slate-900">₹{product.price.toLocaleString('en-IN')}</span>
                                    <span className="text-xs text-slate-400 line-through">₹{product.originalPrice.toLocaleString('en-IN')}</span>
                                </div>

                                <div>
                                    <label className="text-xs font-semibold text-slate-600 block mb-1">Select Size (UK):</label>
                                    <div className="flex flex-wrap gap-1">
                                        {product.sizes.map(sz => (
                                            <button 
                                                key={sz}
                                                onClick={() => setSelectedSize(sz)}
                                                className={`text-xs w-7 h-7 rounded font-bold border ${selectedSize === sz ? 'bg-brand-600 text-white' : 'bg-slate-50'}`}
                                            >
                                                {sz}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-2 pt-2">
                                    <button 
                                        onClick={() => {
                                            if (addToCart(product, selectedSize, product.colors[0])) onClose();
                                        }}
                                        className="w-full bg-accent-500 hover:bg-accent-600 text-white font-bold py-2.5 rounded-xl shadow transition text-xs"
                                    >
                                        Add To Cart
                                    </button>
                                    <button onClick={onFullView} className="w-full bg-slate-100 text-slate-800 font-bold py-2 rounded-xl text-xs hover:bg-slate-200">
                                        View Full Details Page
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AuthModal({ onClose, onLogin }) {
            const [isSignup, setIsSignup] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [name, setName] = React.useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin({ name: name || 'Demo Shopper', email: email || 'shopper@shoekart.com' });
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-sm w-full p-6 relative shadow-2xl">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800">✕</button>
                        <h2 className="text-xl font-black text-slate-900 mb-1">{isSignup ? 'Create ShoeKart Account' : 'Login to ShoeKart'}</h2>
                        <p className="text-xs text-slate-500 mb-4">Access your orders, wishlist, and recommendations</p>

                        <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                            {isSignup && (
                                <div>
                                    <label className="font-semibold text-slate-600 block mb-1">Full Name</label>
                                    <input required type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2 border border-slate-200 rounded-lg" placeholder="Rahul Sharma" />
                                </div>
                            )}
                            <div>
                                <label className="font-semibold text-slate-600 block mb-1">Email or Mobile</label>
                                <input required type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-2 border border-slate-200 rounded-lg" placeholder="rahul@gmail.com" />
                            </div>
                            <div>
                                <label className="font-semibold text-slate-600 block mb-1">Password</label>
                                <input required type="password" className="w-full p-2 border border-slate-200 rounded-lg" placeholder="••••••••" />
                            </div>

                            <button type="submit" className="w-full bg-brand-600 text-white font-bold py-2.5 rounded-lg hover:bg-brand-700 transition">
                                {isSignup ? 'Sign Up' : 'Login'}
                            </button>
                        </form>

                        <div className="mt-4 text-center text-xs text-slate-500">
                            {isSignup ? 'Already have an account?' : "Don't have an account?"}{' '}
                            <button onClick={() => setIsSignup(!isSignup)} className="text-brand-600 font-bold hover:underline">
                                {isSignup ? 'Login' : 'Sign Up'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ products, setProducts, showToast }) {
            const [tab, setTab] = React.useState('analytics');
            const [newShoe, setNewShoe] = React.useState({
                name: '', brand: 'Nike', category: 'Running Shoes', gender: 'Men',
                price: '', originalPrice: '', sizes: '6,7,8,9,10',
                image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=80',
                description: 'High performance sports shoe'
            });

            React.useEffect(() => {
                if (window.lucide) window.lucide.createIcons();

                if (tab === 'analytics') {
                    const ctx = document.getElementById('salesChart');
                    if (ctx) {
                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                                datasets: [{
                                    label: 'Monthly Sales (in ₹ Lakhs)',
                                    data: [12, 19, 15, 25, 22, 30],
                                    borderColor: '#2563eb',
                                    tension: 0.3
                                }]
                            }
                        });
                    }
                }
            }, [tab]);

            const handleAddProduct = (e) => {
                e.preventDefault();
                const p = {
                    id: 'sk-' + (products.length + 101),
                    name: newShoe.name,
                    brand: newShoe.brand,
                    category: newShoe.category,
                    gender: newShoe.gender,
                    price: Number(newShoe.price),
                    originalPrice: Number(newShoe.originalPrice || newShoe.price),
                    discount: Math.round(((newShoe.originalPrice - newShoe.price) / newShoe.originalPrice) * 100) || 0,
                    rating: 4.5,
                    reviewCount: 1,
                    sizes: newShoe.sizes.split(',').map(s => Number(s.trim())),
                    colors: ["Black", "White"],
                    images: [newShoe.image],
                    inStock: true,
                    stockCount: 20,
                    isNew: true,
                    isTrending: false,
                    isBestSeller: false,
                    description: newShoe.description
                };
                setProducts([p, ...products]);
                showToast(`New Shoe "${p.name}" added successfully!`, 'success');
            };

            const handleDelete = (id) => {
                setProducts(products.filter(p => p.id !== id));
                showToast('Product deleted from inventory', 'info');
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                    <div className="flex justify-between items-center bg-slate-900 text-white p-6 rounded-2xl shadow">
                        <div>
                            <h2 className="text-xl font-extrabold">ShoeKart Seller & Admin Dashboard</h2>
                            <p className="text-xs text-slate-400">Manage catalog inventory, prices, orders, and coupons</p>
                        </div>
                        <div className="flex gap-2 text-xs font-bold">
                            {['analytics', 'inventory', 'add-product'].map(t => (
                                <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-lg capitalize ${tab === t ? 'bg-brand-600 text-white' : 'bg-slate-800 text-slate-300'}`}>
                                    {t.replace('-', ' ')}
                                </button>
                            ))}
                        </div>
                    </div>

                    {tab === 'analytics' && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm md:col-span-2">
                                <h3 className="text-sm font-bold text-slate-800 mb-4">Revenue Trends</h3>
                                <canvas id="salesChart" height="120"></canvas>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                                <h3 className="text-sm font-bold text-slate-800">Quick Stats</h3>
                                <div className="p-3 bg-brand-50 rounded-lg">
                                    <div className="text-xs text-brand-600 font-bold">Total Products</div>
                                    <div className="text-2xl font-black text-slate-900">{products.length}</div>
                                </div>
                                <div className="p-3 bg-emerald-50 rounded-lg">
                                    <div className="text-xs text-emerald-600 font-bold">Active Orders</div>
                                    <div className="text-2xl font-black text-slate-900">142</div>
                                </div>
                            </div>
                        </div>
                    )}

                    {tab === 'inventory' && (
                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                            <table className="w-full text-left text-xs text-slate-600">
                                <thead className="bg-slate-50 uppercase font-bold text-slate-400 border-b">
                                    <tr>
                                        <th className="p-3">Shoe</th>
                                        <th className="p-3">Brand</th>
                                        <th className="p-3">Price</th>
                                        <th className="p-3">Category</th>
                                        <th className="p-3">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {products.map(p => (
                                        <tr key={p.id} className="border-b hover:bg-slate-50">
                                            <td className="p-3 font-bold text-slate-800 flex items-center gap-2">
                                                <img src={p.images[0]} className="w-8 h-8 rounded object-cover" />
                                                {p.name}
                                            </td>
                                            <td className="p-3">{p.brand}</td>
                                            <td className="p-3 font-bold">₹{p.price.toLocaleString('en-IN')}</td>
                                            <td className="p-3">{p.category}</td>
                                            <td className="p-3">
                                                <button onClick={() => handleDelete(p.id)} className="text-rose-600 hover:underline font-bold">Delete</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {tab === 'add-product' && (
                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm max-w-2xl mx-auto">
                            <h3 className="text-base font-bold text-slate-900 mb-4">Add New Shoe to Catalog</h3>
                            <form onSubmit={handleAddProduct} className="grid grid-cols-2 gap-3 text-xs">
                                <div className="col-span-2">
                                    <label className="font-bold text-slate-600 block mb-1">Shoe Name</label>
                                    <input required type="text" value={newShoe.name} onChange={e=>setNewShoe({...newShoe, name: e.target.value})} className="w-full p-2 border rounded-lg" placeholder="e.g. Revolution 6 Running Shoes" />
                                </div>
                                <div>
                                    <label className="font-bold text-slate-600 block mb-1">Brand</label>
                                    <select value={newShoe.brand} onChange={e=>setNewShoe({...newShoe, brand: e.target.value})} className="w-full p-2 border rounded-lg">
                                        {BRANDS.map(b => <option key={b} value={b}>{b}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="font-bold text-slate-600 block mb-1">Category</label>
                                    <select value={newShoe.category} onChange={e=>setNewShoe({...newShoe, category: e.target.value})} className="w-full p-2 border rounded-lg">
                                        {CATEGORIES.filter(c => c !== 'All').map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="font-bold text-slate-600 block mb-1">Selling Price (₹)</label>
                                    <input required type="number" value={newShoe.price} onChange={e=>setNewShoe({...newShoe, price: e.target.value})} className="w-full p-2 border rounded-lg" placeholder="2999" />
                                </div>
                                <div>
                                    <label className="font-bold text-slate-600 block mb-1">Original Price (₹)</label>
                                    <input required type="number" value={newShoe.originalPrice} onChange={e=>setNewShoe({...newShoe, originalPrice: e.target.value})} className="w-full p-2 border rounded-lg" placeholder="4999" />
                                </div>
                                <div className="col-span-2">
                                    <label className="font-bold text-slate-600 block mb-1">Image URL</label>
                                    <input required type="text" value={newShoe.image} onChange={e=>setNewShoe({...newShoe, image: e.target.value})} className="w-full p-2 border rounded-lg" />
                                </div>
                                <button type="submit" className="col-span-2 bg-brand-600 text-white font-bold py-2.5 rounded-lg hover:bg-brand-700">
                                    Save Product
                                </button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
